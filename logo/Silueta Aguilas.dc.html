<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
<style>body{margin:0;background:#F4F1EC;} a{color:#1B96AD;} a:hover{color:#0E7A5F;}</style>
</helmet>
<div style="min-height:100vh;padding:56px 48px 80px;font-family:'Familjen Grotesk',Helvetica Neue,Arial,sans-serif;color:#141414;display:flex;flex-direction:column;gap:44px;max-width:1200px;margin:0 auto">
  <div style="display:flex;flex-direction:column;gap:6px">
    <div style="font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#8A8378">Por Águilas · marca</div>
    <div style="font-size:34px;font-weight:700;letter-spacing:-.02em">Silueta trazada del Cerro del Castillo</div>
    <div style="font-size:15px;color:#5C574F;max-width:640px;text-wrap:pretty">Perfil extraído directamente de la fotografía: castillo de San Juan, cresta rocosa y bajada hacia el puerto. Sustituye la silueta anterior en los tres formatos del logo.</div>
  </div>

  <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start">
    <div style="display:flex;flex-direction:column;gap:8px">
      <div style="font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#8A8378">Fotografía</div>
      <img src="uploads/AGUILAS-2022_05_02-99.jpg" alt="" style="width:100%;display:block;border-radius:2px">
    </div>
    <div style="display:flex;flex-direction:column;gap:8px">
      <div style="font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#8A8378">Silueta</div>
      <div style="background:#fff;padding:0;border-radius:2px;display:flex;align-items:flex-end;height:100%">
        <img src="silueta-aguilas.svg" alt="" style="width:100%;display:block">
      </div>
    </div>
  </div>

  <div style="height:1px;background:#DCD6CC"></div>

  <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:24px;align-items:end">
    <div style="display:flex;flex-direction:column;gap:12px">
      <div style="font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#8A8378">Isotipo</div>
      <div style="background:#fff;padding:32px;display:flex;justify-content:center">
        <img src="por-aguilas-isotipo.png" alt="" style="width:160px;height:160px;display:block">
      </div>
    </div>
    <div style="display:flex;flex-direction:column;gap:12px">
      <div style="font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#8A8378">Una tinta</div>
      <div style="background:#fff;padding:32px;display:flex;justify-content:center">
        <img src="por-aguilas-una-tinta.svg" alt="" style="width:160px;height:160px;display:block">
      </div>
    </div>
    <div style="display:flex;flex-direction:column;gap:12px">
      <div style="font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#8A8378">Logotipo</div>
      <div style="background:#fff;padding:32px;display:flex;justify-content:center">
        <img src="por-aguilas-logotipo.png" alt="" style="width:100%;max-width:260px;display:block">
      </div>
    </div>
  </div>

  <div style="display:flex;flex-direction:column;gap:12px">
    <div style="font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#8A8378">Tamaño mínimo</div>
    <div style="background:#fff;padding:28px;display:flex;align-items:flex-end;gap:36px">
      <img src="por-aguilas-isotipo.png" alt="" style="width:24px;height:24px">
      <img src="por-aguilas-isotipo.png" alt="" style="width:40px;height:40px">
      <img src="por-aguilas-isotipo.png" alt="" style="width:64px;height:64px">
      <img src="por-aguilas-isotipo.png" alt="" style="width:96px;height:96px">
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
